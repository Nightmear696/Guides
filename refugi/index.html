    <style>
        html { scroll-behavior: smooth; scroll-padding-top: 5rem; }
        body { overflow-x: clip; } /* las capturas laterales no generan scroll horizontal */

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #0b1a0e; }
        ::-webkit-scrollbar-thumb { background: #2a4a32; border-radius: 10px; border: 2px solid #0b1a0e; }

        .hero-gradient {
            background:
                radial-gradient(circle at 20% 20%, rgba(102, 187, 106, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(255, 179, 0, 0.12) 0%, transparent 40%),
                linear-gradient(135deg, #1B5E20 0%, #12291a 55%, #0b1a0e 100%);
        }

        .sticky-appbar {
            background: rgba(11, 26, 14, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* ---------- Pila de capturas (carrusel) ---------- */
        .img-stack {
            position: relative;
            height: 460px;
            width: 100%;
            max-width: 520px;
        }
        @media (max-width: 640px) { .img-stack { height: 380px; } }

        .shot {
            position: absolute;
            left: 50%;
            top: 50%;
            height: 90%;
            aspect-ratio: 9 / 20; /* capturas de 1080x2400 */
            border-radius: 2rem;
            overflow: hidden;
            cursor: pointer;
            background: linear-gradient(160deg, #23502e 0%, #12291a 100%);
            border: 3px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

        /* Marcador mientras no haya captura real */
        .shot .ph {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.9rem; padding: 1.25rem; text-align: center;
            color: rgba(241, 250, 241, 0.75);
        }
        .shot .ph::before {
            content: ''; position: absolute; top: 0.7rem; left: 50%; transform: translateX(-50%);
            width: 34%; height: 0.45rem; border-radius: 1rem; background: rgba(0, 0, 0, 0.35);
        }
        .shot .ph i { font-size: 2.6rem; color: #66BB6A; }
        .shot .ph span { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 0.95rem; line-height: 1.2; }

        .pos-hidden    { transform: translate(-50%, -50%) scale(0.5); opacity: 0; z-index: 0; pointer-events: none; }
        .pos-left-far  { transform: translate(-115%, -50%) rotate(-12deg); z-index: 5;  opacity: 0.35; }
        .pos-left      { transform: translate(-88%, -50%) rotate(-8deg);  z-index: 10; opacity: 0.7; }
        .pos-right     { transform: translate(-12%, -50%) rotate(8deg);   z-index: 10; opacity: 0.7; }
        .pos-right-far { transform: translate(15%, -50%) rotate(12deg);   z-index: 5;  opacity: 0.35; }
        .pos-focus {
            transform: translate(-50%, -50%) scale(1.1);
            z-index: 50; opacity: 1;
            border-color: #FFB300;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        /* ---------- Tarjetas de funciones ---------- */
        .feature {
            display: flex; align-items: center; gap: 1.25rem;
            padding: 1.25rem 1.5rem; border-radius: 1rem; text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.07);
            background: rgba(255, 255, 255, 0.03);
            transition: border-color .25s, background .25s, transform .25s;
        }
        .feature:hover { border-color: rgba(255, 179, 0, 0.6); transform: translateX(4px); }
        .feature.is-active { border-color: #FFB300; background: rgba(255, 179, 0, 0.07); }
        .feature .ico {
            flex-shrink: 0; width: 3.25rem; height: 3.25rem; border-radius: 0.85rem;
            display: flex; align-items: center; justify-content: center; font-size: 1.35rem;
            transition: transform .25s;
        }
        .feature:hover .ico { transform: scale(1.1); }

        .lang-btn { padding: 0.25rem 0.6rem; border-radius: 0.5rem; font-weight: 900; font-size: 0.75rem; letter-spacing: .05em; color: rgba(255,255,255,.6); }
        .lang-btn.is-active { background: #FFB300; color: #0b1a0e; }

    </style>

                        { t: 'Només monitors', d: 'Els comptes els crea coordinació; ningú més s\'hi pot registrar.' },
                        { t: 'Cadascú, els seus grups', d: 'Un monitor només veu les fitxes i sortides dels seus grups.' },
                        { t: 'Sense captures', d: 'La pantalla de fitxes no es pot capturar ni apareix a les apps recents.' },
                        { t: 'Tanca la sessió', d: 'Si canvies de mòbil o el deixes, tanca la sessió des del teu perfil.' },
                    ],
                },
                footer: { title: "Esplai El Refugi · App de monitors" },
            },
        };

        /* ============================ LÓGICA ============================ */
        const POSICIONES = ['pos-focus', 'pos-left', 'pos-right', 'pos-left-far', 'pos-right-far', 'pos-hidden'];
        const foco = {};          // índice enfocado por sección
        let idioma = 'es';

        const get = (obj, path) => path.split('.').reduce((o, k) => (o ? o[k] : undefined), obj);

        function posicionPara(distancia) {
            switch (distancia) {
                case 0: return 'pos-focus';
                case -1: return 'pos-left';
                case 1: return 'pos-right';
                case -2: return 'pos-left-far';
                case 2: return 'pos-right-far';
                default: return 'pos-hidden';
            }
        }

        // Activa la función [indice] de una sección y pone delante su captura
        function enfocar(seccionId, indice) {
            const sec = SECCIONES.find((s) => s.id === seccionId);
            const shot = sec.features[indice].shot;
            foco[seccionId] = indice;
            document.querySelectorAll(`#stack-${seccionId} .shot`).forEach((fig, i) => {
                fig.classList.remove(...POSICIONES);
                fig.classList.add(posicionPara(i - shot));
            });
            document.querySelectorAll(`.feature[data-section="${seccionId}"]`).forEach((btn) => {
                btn.classList.toggle('is-active', Number(btn.dataset.index) === indice);
            });
        }

        // Al pulsar una captura se activa la primera función que la usa
        function enfocarCaptura(seccionId, shot) {
            const sec = SECCIONES.find((s) => s.id === seccionId);
            const indice = sec.features.findIndex((f) => f.shot === shot);
            if (indice >= 0) enfocar(seccionId, indice);
        }

        function renderSecciones() {
            const T = TEXTOS[idioma];
            const html = SECCIONES.map((sec, n) => {
                const tx = T.sections[sec.id];
                const alterna = n % 2 === 1;       // fondo e imagen alternados
                const bg = alterna ? 'bg-refugi-forest' : 'bg-refugi-dark';

                const botones = sec.features.map((f, i) => `
                    <button class="feature group" data-section="${sec.id}" data-index="${i}">
                        <div class="ico ${ICON_STYLES[i % ICON_STYLES.length]}"><i class="fa-solid ${f.icon}"></i></div>
                        <div>
                            <h4 class="font-bold text-lg tracking-tight text-white">${tx.features[i].t}</h4>
                            <p class="text-sm text-slate-400">${tx.features[i].d}</p>
                        </div>
                    </button>`).join('');

                const capturas = sec.shots.map((img, s) => {
                    const i = sec.features.findIndex((f) => f.shot === s);   // primera función que la usa
                    return `
                    <figure class="shot pos-hidden" data-shot-section="${sec.id}" data-shot="${s}">
                        <div class="ph"><i class="fa-solid ${sec.features[i].icon}"></i><span>${tx.features[i].t}</span></div>
                        <img src="img/capturas/${img}" alt="${tx.features[i].t}" loading="lazy" onerror="this.remove()">
                    </figure>`;
                }).join('');

                return `
                <section id="${sec.id}" class="py-28 px-4 ${bg} border-b border-white/5 text-white overflow-hidden relative">
                    ${alterna ? '' : '<div class="absolute top-0 right-0 w-96 h-96 bg-refugi-mid/10 rounded-full blur-3xl -mr-48 -mt-48"></div>'}
                    <div class="max-w-7xl mx-auto relative">
                        <div class="grid lg:grid-cols-2 gap-16 lg:gap-24 items-center">
                            <div class="space-y-8 ${alterna ? 'lg:order-2' : ''}">
                                <div class="inline-block px-5 py-2 ${alterna ? 'bg-refugi-dark' : 'bg-refugi-forest'} text-refugi-amber rounded-xl font-bold tracking-widest text-sm uppercase">${tx.tag}</div>
                                <h2 class="font-display text-5xl md:text-6xl font-extrabold tracking-tighter leading-tight">${tx.title}</h2>
                                <p class="text-lg md:text-xl text-slate-300 leading-relaxed max-w-xl font-light">${tx.text}</p>
                                <div class="grid gap-3">${botones}</div>
                            </div>
                            <div class="flex justify-center items-center ${alterna ? 'lg:order-1' : ''}">
                                <div class="img-stack" id="stack-${sec.id}">${capturas}</div>
                            </div>
                        </div>
                    </div>
                </section>`;
            }).join('');

            document.getElementById('sections').innerHTML = html;

            document.querySelectorAll('.feature[data-section]').forEach((el) => {
                el.addEventListener('click', () => enfocar(el.dataset.section, Number(el.dataset.index)));
            });
            document.querySelectorAll('.shot[data-shot-section]').forEach((el) => {
                el.addEventListener('click', () => enfocarCaptura(el.dataset.shotSection, Number(el.dataset.shot)));
            });
            SECCIONES.forEach((sec) => enfocar(sec.id, foco[sec.id] ?? 0));
        }

        function renderNav() {
            const L = TEXTOS[idioma].navLinks;
            document.getElementById('navLinks').innerHTML = Object.keys(L)
                .map((id) => `<a href="#${id}" class="hover:text-refugi-amber transition-colors">${L[id]}</a>`)
                .join('');
        }

        function renderPrivacidad() {
            const cards = TEXTOS[idioma].privacy.cards;
            document.getElementById('privacyCards').innerHTML = cards.map((c, i) => `
                <div class="bg-refugi-dark/60 p-6 rounded-2xl border border-white/5 hover:border-refugi-amber/60 transition-colors">
                    <div class="w-12 h-12 rounded-xl flex items-center justify-center text-xl mb-4 ${ICON_STYLES[i % ICON_STYLES.length]}">
                        <i class="fa-solid ${PRIVACIDAD_ICONOS[i]}"></i>
                    </div>
                    <h4 class="font-bold text-lg text-white mb-2">${c.t}</h4>
                    <p class="text-sm text-slate-400">${c.d}</p>
                </div>`).join('');
        }

        function aplicarIdioma(lang) {
            idioma = TEXTOS[lang] ? lang : 'es';
            localStorage.setItem('refugi-guia-idioma', idioma);
            document.documentElement.lang = idioma;
            document.title = TEXTOS[idioma].pageTitle;

            document.querySelectorAll('[data-t]').forEach((el) => {
                const valor = get(TEXTOS[idioma], el.dataset.t);
                if (valor !== undefined) el.innerHTML = valor;
            });
            document.querySelectorAll('.lang-btn').forEach((b) => b.classList.toggle('is-active', b.dataset.lang === idioma));

            renderNav();
            renderSecciones();
            renderPrivacidad();
        }

        // Inicio
        document.getElementById('year').textContent = new Date().getFullYear();
        document.querySelectorAll('.lang-btn').forEach((b) => b.addEventListener('click', () => aplicarIdioma(b.dataset.lang)));

        // Mismo criterio que la app: idioma guardado, o catalán si el navegador está en catalán
        const guardado = localStorage.getItem('refugi-guia-idioma');
        const delNavegador = (navigator.language || '').toLowerCase().startsWith('ca') ? 'ca' : 'es';
        aplicarIdioma(guardado || delNavegador);
    </script>
</body>
</html>
